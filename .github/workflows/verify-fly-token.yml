name: Verify Fly token (temporary)

# Read-only check that the FLY_API_TOKEN secret works. Does not deploy. Delete after use.
on:
  push:
    branches: [sunil]
    paths: [.github/workflows/verify-fly-token.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Token can read the cofoundr app
        run: flyctl status --app cofoundr
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
