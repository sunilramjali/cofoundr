{% extends "base.html" %}
{% block content %}
<article class="sheet glass" style="view-transition-name: {% block vt %}page{% endblock %}">
  <a class="sheet__back" href="/"><svg class="ico"><use href="#i-back"/></svg>Home</a>
  <header class="sheet__head page-in">
    <div>
      <p class="eyebrow">{% block eyebrow %}{% endblock %}</p>
      <h1>{% block heading %}{% endblock %}</h1>
      <p class="lede">{% block lede %}{% endblock %}</p>
    </div>
    {% block stats %}{% endblock %}
  </header>
  <div class="page-in">{% block body %}{% endblock %}</div>
</article>
{% endblock %}
