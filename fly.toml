# CoFoundr web app: dashboard + Saint endpoints. Deploy from the repo root: fly deploy
app = "cofoundr"
primary_region = "lhr"

[env]
  GEMINI_MODEL = "gemini-4-argon"
  MONGODB_DB = "cofoundr-db"
  PUBLIC_URL = "https://cofoundr.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1  # stay warm so Saint and the live demo never hit a cold start

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
