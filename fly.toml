# CoFoundr web app: dashboard + WhatsApp webhook. Deploy from the repo root: fly deploy
app = "cofoundr"
primary_region = "lhr"

[env]
  GEMINI_MODEL = "gemini-4-argon"
  MONGODB_DB = "cofoundr-db"
  PUBLIC_URL = "https://cofoundr.fly.dev"
  GMAIL_POLL_SECONDS = "60"  # check the demo inbox every minute (needs GMAIL_ADDRESS + GMAIL_APP_PASSWORD secrets)
  MORNING_BRIEF_AT = "08:00"  # London time: the owner's morning brief on WhatsApp, once a day
  WHATSAPP_PUSH_SECONDS = "30"  # push new /updates to the owner on WhatsApp (needs the TWILIO_* + OWNER_WHATSAPP secrets)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1  # stay warm so WhatsApp and the live demo never hit a cold start

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
